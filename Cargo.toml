[package]
name = "harvester"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["clock"] }
crossbeam-queue = "0.3.14"
crossterm = "0.29.0"
dashmap = "6.1.0"
futures-util = "0.3.31"
hickory-resolver = "0.26.3"
maxminddb = "0.32"
mimalloc = "0.1.48"
nohash-hasher = "0.2.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["json", "socks", "stream", "hickory-dns"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = "0.7.18"
url = "2.5"
urlencoding = "2.1.3"
uuid = "1.26.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[profile.release]
opt-level = 3
panic = "abort"
strip = true
codegen-units = 1
lto = "fat"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

[lints.rust]
unsafe-code = "forbid"
warnings = "deny"
ambiguous-negative-literals = "deny"
closure-returning-async-block = "deny"
deprecated-in-future = "deny"
deref-into-dyn-supertrait = "deny"
elided-lifetimes-in-paths = "deny"
explicit-outlives-requirements = "deny"
if-let-rescope = "deny"
impl-trait-overcaptures = "deny"
impl-trait-redundant-captures = "deny"
let-underscore-drop = "deny"
meta-variable-misuse = "deny"
redundant-imports = "deny"
redundant-lifetimes = "deny"
single-use-lifetimes = "deny"
tail-expr-drop-order = "deny"
trivial-casts = "deny"
trivial-numeric-casts = "deny"
unit-bindings = "deny"
unnameable-types = "deny"
unused-crate-dependencies = "deny"
unused-extern-crates = "deny"
unused-import-braces = "deny"
unused-lifetimes = "deny"
unused-qualifications = "deny"
unused-results = "deny"
variant-size-differences = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
as_conversions = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
empty_drop = "deny"
error_impl_error = "deny"
expect_used = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "deny"
non_zero_suggestions = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
pub_with_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
shadow_unrelated = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
