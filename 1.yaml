mixed-port: 33333
bind-address: "127.0.0.1"
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

secret: mihomo
external-ui: ui # --> http://127.0.0.1:33332/ui/#/setup?hostname=127.0.0.1&port=33332&secret=mihomo <--
external-ui-url: https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz
external-controller: 127.0.0.1:33332

hosts:
  'xbox-dns.ru': 111.88.96.50
  'dns.geohide.ru': 45.155.204.190

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 111.88.96.50 # xbox
    - 45.155.204.190 # geohide
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - MATCH,fake-ip
  nameserver-policy:
    'geosite:openai,spotify,twitch,anthropic':
      - https://xbox-dns.ru/dns-query
    'geosite:google-deepmind':
      - https://xbox-dns.ru/dns-query
    #  - https://dns.geohide.ru:444/dns-query
  nameserver:
    - https://xbox-dns.ru/dns-query
    - https://dns.geohide.ru:444/dns-query
    - https://dns.google/dns-query

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

payload-anchors:
  health_check: &health_check
    health-check:
      enable: true
      url: https://connectivitycheck.gstatic.com/generate_204
      interval: 60
      timeout: 3000
      lazy: true
  url_test: &url_test
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 60
    lazy: true
    timeout: 3000
    max-failed-times: 3
    tolerance: 50
  ip: &ip               {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  domain: &domain       {type: http, interval: 86400, behavior: domain,    format: mrs}
  classical: &classical {type: http, interval: 86400, behavior: classical, format: yaml}

proxy-providers:
  warp_provider:
    type: http
    url: https://fastly.jsdelivr.net/gh/luxxuria/harvester@main/warp-endpoints.list
    path: ./providers/warp-endpoints.yaml
    interval: 72000
    <<: *health_check
  non_ru:
    type: http
    url: "https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/non_ru.txt"
    path: ./providers/non_ru.yaml
    interval: 3600
    <<: *health_check
  ig1:
    type: http
    url: "https://cdn.jsdelivr.net/gh/igareck/vpn-configs-for-russia@main/Vless-Reality-White-Lists-Rus-Mobile.txt"
    path: ./providers/ig1.yaml
    interval: 3600
    <<: *health_check
  ig2:
    type: http
    url: "https://cdn.jsdelivr.net/gh/igareck/vpn-configs-for-russia@main/Vless-Reality-White-Lists-Rus-Mobile-2.txt"
    path: ./providers/ig2.yaml
    interval: 3600
    <<: *health_check


proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - warp-auto
      - warp-select
      - custom
      - igareck
  - name: warp-auto
    <<: *url_test
    use:
      - warp_provider
  - name: warp-select
    type: select
    use:
      - warp_provider
  - name: custom
    <<: *url_test
    use:
      - non_ru
  - name: igareck
    <<: *url_test
    use:
      - ig1
      - ig2


rules:
  - RULE-SET,private-ips,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - IP-CIDR,::/0,REJECT,no-resolve
  - RULE-SET,oisd_big,REJECT-DROP
  - GEOSITE,category-ads-all,REJECT-DROP
  - GEOSITE,tiktok,custom
  - GEOSITE,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT
  - RULE-SET,wld,DIRECT
  - RULE-SET,wldc,DIRECT
  - GEOSITE,youtube,PROXY
  - GEOSITE,google,DIRECT
  - GEOSITE,openai,DIRECT
  - GEOSITE,anthropic,DIRECT
  - GEOSITE,spotify,DIRECT
  - GEOSITE,twitch,DIRECT
  - GEOSITE,pinterest,DIRECT
  - MATCH,PROXY


rule-providers:
  oisd_big:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/oisd/big.mrs"
    path: ./rule-sets/oisd_big.mrs
  wld:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wld.mrs"
    path: ./rule-sets/wld.mrs
  wldc:
    <<: *classical
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wldc.yaml"
    path: ./rule-sets/wldc.yaml
  private-ips:
    <<: *ip
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"
    path: ./rule-sets/private.mrs
  whitelist:
    <<: *domain
    url: https://fastly.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs
    path: ./rule-sets/whitelist.mrs
