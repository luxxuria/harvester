mixed-port: 10707
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

secret: mihomo
external-ui: ui # --> http://127.0.0.1:10706/ui/#/setup?hostname=127.0.0.1&port=10706&secret=mihomo <--
external-ui-url: https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz

bind-address: "127.0.0.1"
external-controller: 127.0.0.1:10706
allow-lan: false
external-controller-cors:
  allow-private-network: false
  allow-origins:
    - '*'

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - MATCH,fake-ip
  nameserver-policy:
    'geosite:openai,spotify,twitch,anthropic,xai':
      - https://sync.bezmezhau.com/dns-query
    'geosite:google-deepmind':
      - https://sync.bezmezhau.com/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

anchors:
  select: &select {type: select}
  health_check: &health_check
    health-check:
      enable: true
      url: https://connectivitycheck.gstatic.com/generate_204
      interval: 60
      timeout: 3000
      lazy: false

  url_test: &url_test
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 60
    timeout: 3000
    lazy: false
    max-failed-times: 3
    tolerance: 50

  http: &http
    type: http
    interval: 3600
    <<: *health_check

  warp-list:   &warp-list   https://raw.githubusercontent.com/luxxuria/harvester/refs/heads/main/warp-endpoints.list
  non_ru-list: &non_ru-list https://raw.githubusercontent.com/luxxuria/harvester/refs/heads/main/non_ru.txt
  
  ip:        &ip        {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  domain:    &domain    {type: http, interval: 86400, behavior: domain,    format: mrs}
  classical: &classical {type: http, interval: 86400, behavior: classical, format: yaml}


proxy-providers:
  warp_provider:        {<<: *http, url: *warp-list,   path: ./providers/warp.yaml, interval: 86400}
  non_ru_provider:      {<<: *http, url: *non_ru-list, path: ./providers/non_ru.yaml}
  non_ru_provider-auto: {<<: *http, url: *non_ru-list, path: ./providers/non_ru-auto.yaml}

proxy-groups:
  - {name: PROXY,         <<: *select,   proxies: [warp, non_ru-select, non_ru-auto]}
  - {name: warp,          <<: *url_test, use:     [warp_provider]}
  - {name: non_ru-auto,   <<: *url_test, use:     [non_ru_provider-auto]}
  - {name: non_ru-select, <<: *select,   use:     [non_ru_provider]}

rules:
  - SUB-RULE,(NOT,((DOMAIN,private))),private
  - SUB-RULE,(NOT,((DOMAIN,reject))),reject
  - SUB-RULE,(NOT,((DOMAIN,russia))),russia
  - SUB-RULE,(NOT,((DOMAIN,non-ru))),non-ru
  - SUB-RULE,(NOT,((DOMAIN,direct))),direct

  - MATCH,PROXY

sub-rules:
  private:
    - RULE-SET,private-ips,DIRECT,no-resolve
    - GEOSITE,private,DIRECT
  reject:
    - IP-CIDR,::/0,REJECT,no-resolve
    - RULE-SET,oisd_big,REJECT
    - GEOSITE,category-ads-all,REJECT
  russia:
    - GEOSITE,category-ru,DIRECT
    - GEOIP,ru,DIRECT,no-resolve
    - RULE-SET,whitelist,DIRECT
    - RULE-SET,wld,DIRECT
    - RULE-SET,wldc,DIRECT
  non-ru:
    - DOMAIN-SUFFIX,openrouter.ai,non_ru-auto
    - GEOSITE,tiktok,non_ru-auto
    - GEOSITE,youtube,PROXY
    - GEOSITE,google-deepmind,PROXY
  direct:
    - GEOSITE,google,DIRECT
    - GEOSITE,pinterest,DIRECT
    - GEOSITE,reddit,DIRECT

rule-providers:
  private-ips:
    <<: *ip
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"
    path: ./rule-sets/private.mrs
  oisd_big:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/oisd/big.mrs"
    path: ./rule-sets/oisd_big.mrs
  whitelist:
    <<: *domain
    url: https://fastly.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs
    path: ./rule-sets/whitelist.mrs
  wld:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wld.mrs"
    path: ./rule-sets/wld.mrs
  wldc:
    <<: *classical
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wldc.yaml"
    path: ./rule-sets/wldc.yaml

listeners:
  - name: warp-inbound
    type: mixed
    port: 10708
    listen: 0.0.0.0
    udp: true
    proxy: warp
  - name: non_ru-inbound
    type: mixed
    port: 10709
    listen: 0.0.0.0
    udp: true
    proxy: non_ru-auto
