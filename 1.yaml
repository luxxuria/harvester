mixed-port: 10707
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"

secret: mihomo
external-ui: ui # --> http://127.0.0.1:10706/ui/#/setup?hostname=127.0.0.1&port=10706&secret=mihomo <--
external-ui-url: https://ghproxy.net/https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz

bind-address: "127.0.0.1"
external-controller: 127.0.0.1:10706
allow-lan: false

dns:
  enable: true
  cache-algorithm: arc
  use-hosts: false
  use-system-hosts: false
  respect-rules: true
  listen: 127.0.0.1:1053
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  enhanced-mode: fake-ip
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - MATCH,fake-ip
  nameserver-policy:
    'geosite:openai,spotify,twitch,anthropic,xai,google-deepmind':
      - https://dns.zapret.moe/dns-query
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://dns.quad9.net/dns-query

#  https://dns.zapret.moe/dns-query
#  https://dns.malw.link/dns-query
#  https://dns.bezmezhau.com/dns-query

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

anchors:
  select: &select {type: select}
  health_check: &health_check
    health-check:
      enable: true
      url: https://web.telegram.org
      interval: 60
      timeout: 3000
      lazy: false

  url_test: &url_test
    type: url-test
    url: https://web.telegram.org
    interval: 60
    timeout: 3000
    lazy: false
    max-failed-times: 3
    tolerance: 50

  http: &http
    type: http
    interval: 3600
    <<: *health_check

  warp-list:    &warp-list    https://fastly.jsdelivr.net/gh/luxxuria/harvester@main/warp-endpoints.list
  non_ru-list:  &non_ru-list  https://fastly.jsdelivr.net/gh/luxxuria/harvester@main/non_ru.txt
  igareck-list: &igareck-list https://ghproxy.net/https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt

  ip:        &ip        {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  domain:    &domain    {type: http, interval: 86400, behavior: domain,    format: mrs}
  classical: &classical {type: http, interval: 86400, behavior: classical, format: yaml}


proxy-providers:
  warp-provider:    {<<: *http, url: *warp-list,    path: ./providers/warp.yaml, interval: 86400}
  non_ru-provider:  {<<: *http, url: *non_ru-list,  path: ./providers/non_ru.yaml}
  igareck-provider: {<<: *http, url: *igareck-list, path: ./providers/igareck.yaml}


proxy-groups:
  - {name: PROXY,         <<: *select,   proxies: [warp, non_ru-select, non_ru-auto, igareck-auto]}
  - {name: warp,          <<: *url_test, use:     [warp-provider]}
  - {name: non_ru-auto,   <<: *url_test, use:     [non_ru-provider]}
  - {name: igareck-auto,  <<: *url_test, use:     [igareck-provider]}
  - {name: non_ru-select, <<: *select,   use:     [non_ru-provider]}


rules:
  - SUB-RULE,(NOT,((DOMAIN,private))),private
  - SUB-RULE,(NOT,((DOMAIN,reject))),reject
  - SUB-RULE,(NOT,((DOMAIN,non-ru))),non-ru
  - SUB-RULE,(NOT,((DOMAIN,russia))),russia
  - SUB-RULE,(NOT,((DOMAIN,direct))),direct

  - MATCH,PROXY

sub-rules:
  private:
    - RULE-SET,private-ips,DIRECT,no-resolve
    - GEOSITE,private,DIRECT
  reject:
    - RULE-SET,oisd_big,REJECT
    - GEOSITE,category-ads-all,REJECT
  non-ru:
    - DOMAIN-SUFFIX,openrouter.ai,non_ru-auto
    - GEOSITE,tiktok,non_ru-auto
    - GEOSITE,youtube,PROXY
    - GEOSITE,google-play,PROXY
    - GEOSITE,google-deepmind,PROXY
  russia:
    - GEOSITE,category-ru,DIRECT
    - GEOIP,ru,DIRECT,no-resolve
    - RULE-SET,whitelist,DIRECT
    - RULE-SET,wld,DIRECT
    - RULE-SET,wldc,DIRECT
  direct:
    - GEOSITE,google,DIRECT
    - GEOSITE,pinterest,DIRECT
    - GEOSITE,reddit,DIRECT
    - GEOSITE,deepseek,DIRECT

rule-providers:
  private-ips:
    <<: *ip
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"
    path: ./rule-sets/private.mrs
  oisd_big:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/oisd/big.mrs"
    path: ./rule-sets/oisd_big.mrs
  whitelist:
    <<: *domain
    url: https://fastly.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs
    path: ./rule-sets/whitelist.mrs
  wld:
    <<: *domain
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wld.mrs"
    path: ./rule-sets/wld.mrs
  wldc:
    <<: *classical
    url: "https://fastly.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/wldc.yaml"
    path: ./rule-sets/wldc.yaml

listeners:
  - name: warp-inbound
    type: mixed
    port: 10708
    listen: 127.0.0.1
    udp: true
    proxy: warp
  - name: non_ru-inbound
    type: mixed
    port: 10709
    listen: 127.0.0.1
    udp: true
    proxy: non_ru-auto
